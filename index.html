<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eremita</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section class="login">
        <h1>Eremita</h1>
        <p>Boas-vindas!</p>
        <form>
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="Digite seu email"
            required
          />

          <label for="password">Senha:</label>
          <div class="campo-senha">
            <input
              type="password"
              id="password"
              placeholder="Digite sua senha"
              required
            />
            <button type="button" id="mostrarSenha">👁</button>
          </div>

          <p id="mensagemErro"></p>

          <button type="submit" id="btnEntrar">Entrar</button>
        </form>
      </section>

      <section class="painel">
        <header class="cabeçalho">
          <div>
            <h1>Olá, Emanuel!</h1>
            <p>Bem-vindo à Eremita</p>
          </div>

          <button type="button" id="btnSair">Sair</button>
        </header>

        <section class="resumo">
          <div class="card-resumo">
            <h2>Total de dividas</h2>

            <p id="totalDividas">R$ 0,00</p>
          </div>
          <div class="card-resumo">
            <h2>Em aberto</h2>
            <p id="totalEmAberto">R$ 0,00</p>
          </div>
          <div class="card-resumo">
            <h2>Pagas</h2>
            <p id="totalPagas">R$ 0,00</p>
          </div>

          <div class="card-resumo">
            <h2>Atrasadas</h2>
            <p id="totalAtrasadas">R$ 0,00</p>
            <small id="quantidadeAtrasadas">0 dívidas</small>
          </div>
        </section>
        <section class="dividas">
          <div class="titulo-dividas">
            <h2>Minhas dívidas</h2>

            <button type="button" id="btnNovaDivida">+ Nova dívida</button>
          </div>

          <div class="formulario-divida" id="formularioDivida">
            <h2>Nova dívida</h2>

            <label for="nome-divida">Nome da dívida</label>
            <input type="text" id="nome-divida" placeholder="Ex: Internet" />

            <label for="valor-divida">Valor</label>
            <input type="number" id="valor-divida" placeholder="Ex: 100" />

            <label for="vencimento-divida">Vencimento</label>
            <input type="date" id="vencimento-divida" />

            <div class="botoes-formulario">
              <button type="button" id="btnCancelar">Cancelar</button>
              <button type="button" id="btnCadastrar">Cadastrar</button>
            </div>
          </div>
          <div class="lista-dividas" id="listaDividas"></div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
